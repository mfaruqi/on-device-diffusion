[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftadd-flux"
version = "0.1.0"
description = "Reproducible ShiftAdd-format experiments for distilled Klein"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "safetensors"]

[project.optional-dependencies]
dev = ["ruff==0.17.3"]
images = ["diffusers", "transformers", "accelerate", "pillow", "sentencepiece", "protobuf"]
plots = ["matplotlib", "pillow"]
publish = ["wandb", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["vendor", "artifacts", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
